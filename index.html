r (Tyris Flare) | ⚠️ Tyris Flare menunggangi binatang buas dan mengayunkan pedang besar memotong prajurit tiran menjadi dua bagian (dismemberment) bersimbah genangan darah kental | 📲 PC (Winlator / RPCS3) / PS3 / Xbox 360", "thumb": "https://images.weserv.nl/?url=https://tse2.mm.bing.net/th?q=Golden%20Axe%3A%20Beast%20Rider%20%28PS3/Xbox%20360%20Port%20via%20RPCS3/Winlator%29%20video%20game%20cover&w=400&h=225&c=7&rs=1&p=0"}];
    const platforms = ["🔞 NSFW / Dewasa", "🎮 PS Vita", "👾 Nintendo Switch", "💿 PS2", "🕹️ PSP", "📱 Android", "📺 Retro Klasik", "🩸 Mainstream & Indie Action (Gore / Roguelite / Hack & Slash)"];
    
    const itemsPerPage = 24;
    let currentPage = 1;
    let selectedPlatform = "ALL";
    let searchQuery = "";
    let filteredGames = allGames;

    const gameGrid = document.getElementById('gameGrid');
    const countDisplay = document.getElementById('count');
    const filterBar = document.getElementById('filterBar');
    const paginationBar = document.getElementById('pagination');
    const searchInput = document.getElementById('search');

    function buildFilterBar() {
        filterBar.innerHTML = '';
        
        const allBtn = document.createElement('button');
        allBtn.className = 'pill-btn active';
        allBtn.textContent = '🌐 Semua Platform';
        allBtn.onclick = () => selectPlatform('ALL', allBtn);
        filterBar.appendChild(allBtn);

        platforms.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'pill-btn';
            btn.textContent = p;
            btn.onclick = () => selectPlatform(p, btn);
            filterBar.appendChild(btn);
        });
    }

    function selectPlatform(plat, btnElement) {
        selectedPlatform = plat;
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        applyFilter();
    }

    function applyFilter() {
        filteredGames = allGames.filter(game => {
            const matchPlat = (selectedPlatform === "ALL") || (game.platform === selectedPlatform);
            const content = (game.title + " " + game.platform + " " + game.details).toLowerCase();
            const matchSearch = searchQuery === "" || content.includes(searchQuery);
            return matchPlat && matchSearch;
        });
        currentPage = 1;
        render();
    }

    function renderCards() {
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredGames.slice(start, end);

        if (pageItems.length === 0) {
            gameGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">Game tidak ditemukan. Coba kata kunci lain.</div>';
            return;
        }

        gameGrid.innerHTML = pageItems.map(g => `
            <div class="game-card">
                <div class="thumb-container">
                    <img class="thumb" src="${g.thumb}" loading="lazy" alt="${g.title}" onerror="this.parentElement.style.display='none'">
                </div>
                <div class="card-body">
                    <div class="card-meta">
                        <span class="badge-num">#${g.num}</span>
                        <span class="badge-plat">${g.platform}</span>
                    </div>
                    <div class="card-title"><a href="${g.url}" target="_blank">🎯 ${g.title}</a></div>
                    <div class="card-desc">${g.details}</div>
                </div>
            </div>
        `).join('');
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredGames.length / itemsPerPage) || 1;
        
        paginationBar.innerHTML = `
            <button class="page-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>&laquo; Awal</button>
            <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lsaquo; Prev</button>
            <span class="page-info">Hal ${currentPage} / ${totalPages}</span>
            <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>Next &rsaquo;</button>
            <button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage >= totalPages ? 'disabled' : ''}>Akhir &raquo;</button>
        `;
    }

    window.goToPage = function(page) {
        const totalPages = Math.ceil(filteredGames.length / itemsPerPage) || 1;
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderCards();
        renderPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function render() {
        countDisplay.textContent = `Menampilkan ${filteredGames.length} dari ${allGames.length} game`;
        renderCards();
        renderPagination();
    }

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        applyFilter();
    });

    buildFilterBar();
    applyFilter();
</script>
